  <style>
    /* 基础样式 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f7f7f7;
      color: #333;
      padding: 0;
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }

    /* 自定义渐变 */
    .bg-ocean-gradient {
      background: linear-gradient(135deg, #3A7AFE 0%, #81C0FF 100%);
    }
    .bg-sunrise-gradient {
      background: linear-gradient(135deg, #FF9D4D 0%, #FFD09F 100%);
    }
    .bg-sunset-gradient {
      background: linear-gradient(135deg, #FF6E7F 0%, #FFCF96 100%);
    }

    /* 骨架屏动画 */
    @keyframes shimmer {
      0% { background-position: -468px 0 }
      100% { background-position: 468px 0 }
    }
    .skeleton {
      background: linear-gradient(to right, #f6f7f8 8%, #edeef1 18%, #f6f7f8 33%);
      background-size: 800px 104px;
      animation: shimmer 1.5s infinite linear;
    }

    /* 微信小程序特有样式 */
    .wx-statusbar {
      height: 25px;
      width: 100%;
      background-color: #ffffff;
    }

    /* 页面容器 */
    .page-container {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      position: relative;
    }

    /* 底部TabBar */
    .tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      display: flex;
      background-color: #ffffff;
      border-top: 1px solid #eaeaea;
      z-index: 10;
    }

    .tabbar-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #999999;
      font-size: 10px;
    }

    .tabbar-item.active {
      color: #3A7AFE;
    }

    .tabbar-icon {
      font-size: 22px;
      margin-bottom: 3px;
    }

    /* 模拟手机屏幕 */
    .device-wrapper {
      width: 375px;
      height: 812px;
      margin: 20px auto;
      border: 16px solid #111;
      border-radius: 36px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    /* 手势提示 */
    .gesture-hint {
      position: absolute;
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* 弹出层样式 */
    .popup {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .popup.active {
      opacity: 1;
      pointer-events: auto;
    }

    .popup-content {
      width: 80%;
      max-height: 70%;
      background-color: #fff;
      border-radius: 24px;
      padding: 20px;
      overflow-y: auto;
    }
  </style>
</head>

      // 事件监听设置
      function setupEventListeners() {
        // 位置选择器点击事件
        document.getElementById('location-selector').addEventListener('click', function() {
          showLocationSelector();
        });

        // 日期项点击事件
        const dateItems = document.querySelectorAll('.date-item');
        dateItems.forEach(item => {
          item.addEventListener('click', function() {
            // 移除所有活动状态
            dateItems.forEach(di => {
              di.classList.remove('active', 'bg-brand-blue', 'text-white');
              di.classList.add('text-gray-700');
            });

            // 添加活动状态到当前项
            this.classList.add('active', 'bg-brand-blue', 'text-white');
            this.classList.remove('text-gray-700');
          });
        });

        // TabBar项点击事件
        const tabbarItems = document.querySelectorAll('.tabbar-item');
        tabbarItems.forEach((item, index) => {
          item.addEventListener('click', function() {
            // 移除所有活动状态
            tabbarItems.forEach(ti => {
              ti.classList.remove('active');
            });

            // 添加活动状态到当前项
            this.classList.add('active');

            // 根据点击的tab显示对应页面
            if (index === 0) {
              renderHomePage();
            } else if (index === 1) {
              renderSunPage();
            } else if (index === 2) {
              renderTidePage();
            } else if (index === 3) {
              renderProfilePage();
            }
          });
        });

        // 日出日落卡片点击事件
        const sunCard = document.getElementById('sun-card');
        if (sunCard) {
          sunCard.addEventListener('click', function() {
            renderSunPage();
            // 更新底部导航栏状态
            document.querySelectorAll('.tabbar-item').forEach((item, index) => {
              item.classList.toggle('active', index === 1);
            });
          });
        }

        // 潮汐卡片点击事件
        const tideCard = document.getElementById('tide-card');
        if (tideCard) {
          tideCard.addEventListener('click', function() {
            renderTidePage();
            // 更新底部导航栏状态
            document.querySelectorAll('.tabbar-item').forEach((item, index) => {
              item.classList.toggle('active', index === 2);
            });
          });
        }

        // 天气卡片点击事件
        const weatherCard = document.getElementById('weather-card');
        if (weatherCard) {
          const weatherDetailBtn = weatherCard.querySelector('button');
          if (weatherDetailBtn) {
            weatherDetailBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              renderWeatherPage();
            });
          }
        }
      }
